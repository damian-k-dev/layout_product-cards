<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
    <title>Product cards</title>
  </head>
  <body>
    <div class="wrapper">
      <article
        data-qa="card"
        class="card"
      >
        <img
          class="card__image"
          src="./images/imac.jpeg"
          alt="Apple iMac 27 inch Retina 5K"
        />
        <h2 class="card__description">
          APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
        </h2>
        <span class="card__product-code">Product code: 195434</span>
        <div class="card__rating">
          <div class="stars stars--4">
            <div class="stars__star"></div>
            <div class="stars__star"></div>
            <div class="stars__star"></div>
            <div class="stars__star"></div>
            <div class="stars__star"></div>
          </div>
          <span class="card__reviews">Reviews: 5</span>
        </div>
        <div class="card__pricing">
          <span class="card__label">Price:</span>
          <span class="card__value">$2,199</span>
        </div>
        <button
          data-qa="hover"
          class="card__buy-button"
        >
          Buy
        </button>
      </article>
    </div>
  </body>
</html>
